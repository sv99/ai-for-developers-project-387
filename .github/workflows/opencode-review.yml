name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode-review:
    # Включаем проверку так, чтобы бот реагировал на код человека.
    # PR от bot-аккаунтов пропускаем, как и пуши бота в PR человека (например, `/oc`
    # смержил main в ветку): экшен проверяет права того, кто запустил событие,
    # а у opencode-agent[bot] нет write-доступа — ревью падает.
    # PR посторонних (не OWNER/MEMBER/COLLABORATOR) не ревьюим: не тратим ключ,
    # а экшен не падает на проверке прав с комментарием об ошибке.
    if: |
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      !endsWith(github.actor, '[bot]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      # OIDC-токен экшен обменивает на токен GitHub App: ревью пишет opencode-agent[bot].
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        # @latest: opencode CLI экшен всё равно ставит последней версии, а пин обёртки
        # только рассинхронизировал бы её с CLI.
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/glm-5.3-flash
          prompt: |
            Review this pull request:
            - Find bugs and risky changes
            - Check readability and maintainability
            - Leave actionable review comments.
