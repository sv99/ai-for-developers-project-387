name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode-review:
    # Включаем проверку так, чтобы бот реагировал на код человека.
    # PR от bot-аккаунтов пропускаем, как и пуши бота в PR человека (например, `/oc`
    # смержил main в ветку): экшен проверяет права того, кто запустил событие,
    # а у opencode-agent[bot] нет write-доступа — ревью падает.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      # GITHUB_TOKEN (use_github_token) пишет комментарии ревью в PR.
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        uses: anomalyco/opencode/github@latest
        # if: steps.check.outputs.result == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash
          # Токен воркфлоу вместо токена GitHub App, полученного через OIDC.
          use_github_token: true
          prompt: |
            Review this pull request:
            - Find bugs and risky changes
            - Check readability and maintainability
            - Leave actionable review comments.
