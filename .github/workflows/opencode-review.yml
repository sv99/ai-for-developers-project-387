name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode-review:
    # Включаем проверку так, чтобы бот реагировал на код человека.
    # PR от bot-аккаунтов пропускаем.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Render MCP нужен только для деплоя (opencode.yml), ключа RENDER_API_KEY здесь нет:
      # без этого шага {env:RENDER_API_KEY} в opencode.json не разрешится и агент не стартует.
      # skip-worktree скрывает правку от git, иначе opencode-экшен закоммитит её.
      - name: Drop Render MCP
        run: |
          jq 'del(.mcp.servers.render)' opencode.json > opencode.tmp.json
          mv opencode.tmp.json opencode.json
          git update-index --skip-worktree opencode.json

      - name: Run opencode review
        uses: anomalyco/opencode/github@latest
        # if: steps.check.outputs.result == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/glm-5.3-flash
          prompt: |
            Review this pull request:
            - Find bugs and risky changes
            - Check readability and maintainability
            - Leave actionable review comments.
