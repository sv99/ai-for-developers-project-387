name: Scheduled OpenCode Task

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # GITHUB_TOKEN (use_github_token) заводит issues по найденным TODO.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        # Пин к SHA вместо @latest, как в opencode-review.yml: у job есть права на запись.
        # SHA = тег v1.19.4 репозитория anomalyco/opencode.
        uses: anomalyco/opencode/github@148842ef7cb1bc34192b3fff57d0f9721ab9c801
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash
          # Токен воркфлоу вместо токена GitHub App, полученного через OIDC.
          use_github_token: true
          prompt: |
            Review the codebase for any TODO comments and create a summary.
            If you find issues worth addressing, open an issue to track them.
