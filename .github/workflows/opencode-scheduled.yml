name: Scheduled OpenCode Task

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # RENDER_API_KEY в этот воркфлоу не передаётся: без вырезания Render MCP
      # opencode.json невалиден и агент не стартует. skip-worktree скрывает правку
      # от git, иначе opencode-экшен закоммитит её в свой PR.
      - name: Drop Render MCP
        run: |
          jq 'del(.mcp.servers.render)' opencode.json > opencode.tmp.json
          jq empty opencode.tmp.json
          mv opencode.tmp.json opencode.json
          git update-index --skip-worktree opencode.json

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/glm-5.3-flash
          prompt: |
            Review the codebase for any TODO comments and create a summary.
            If you find issues worth addressing, open an issue to track them.
