name: Issue Triage

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  opencode:
    # Отсекаем issues от ботов (включая самого opencode-агента): scheduled-воркфлоу
    # сам создаёт issues — триаж не должен реагировать на собственную работу.
    # Для workflow_dispatch github.event.issue отсутствует, условие истинно.
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # GITHUB_TOKEN (use_github_token) пишет комментарий агента в issue.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        # Пин к SHA вместо @latest, как в opencode-review.yml: у job есть права на запись.
        # SHA = тег v1.19.4 репозитория anomalyco/opencode.
        uses: anomalyco/opencode/github@148842ef7cb1bc34192b3fff57d0f9721ab9c801
        # if: steps.check.outputs.result == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash
          # Токен воркфлоу вместо токена GitHub App, полученного через OIDC.
          use_github_token: true
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.
