name: Issue Triage

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  opencode:
    # Отсекаем issues от ботов (включая самого opencode-агента): scheduled-воркфлоу
    # сам создаёт issues — триаж не должен реагировать на собственную работу.
    # Issues посторонних (не OWNER/MEMBER/COLLABORATOR) не разбираем: не тратим ключ,
    # а экшен не падает на проверке прав с комментарием об ошибке.
    # workflow_dispatch (без github.event.issue) запускают только участники с правом записи.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        # Пин к SHA вместо @latest фиксирует обёртку экшена (action.yml). Сам opencode CLI
        # экшен всё равно ставит последней версии (curl … | bash без версии).
        # SHA = тег v1.19.4 репозитория anomalyco/opencode.
        uses: anomalyco/opencode/github@148842ef7cb1bc34192b3fff57d0f9721ab9c801
        # if: steps.check.outputs.result == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/glm-5.3-flash
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.
