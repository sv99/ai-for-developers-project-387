name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Drop local-only MCP servers
        # Render MCP читает ключ из .secrets/render-api-key, которого в CI нет:
        # без этого шага opencode.json невалиден и агент не стартует.
        # skip-worktree скрывает правку от git, иначе opencode-экшен закоммитит
        # её в свой PR.
        run: |
          jq 'del(.mcp.servers.render)' opencode.json > opencode.tmp.json
          mv opencode.tmp.json opencode.json
          git update-index --skip-worktree opencode.json

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/glm-5.3-flash
