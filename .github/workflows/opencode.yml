name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Отсекаем события ботов (включая самого opencode-агента): его комментарии
    # могут содержать "/oc" как текст, а реакция агента на самого себя — петля.
    # Команды посторонних (не OWNER/MEMBER/COLLABORATOR) игнорируем: не тратим ключ,
    # а экшен не падает на проверке прав с комментарием об ошибке.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        # Пин к SHA вместо @latest: новый релиз экшена не сменит поведение молча.
        # SHA = тег v1.19.4 репозитория anomalyco/opencode.
        uses: anomalyco/opencode/github@148842ef7cb1bc34192b3fff57d0f9721ab9c801
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/glm-5.3-flash
