# Render Blueprint: creates the web service that runs the Docker image.
# Dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: calendar-slot2
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    # Deploy on push to main, but only after GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
